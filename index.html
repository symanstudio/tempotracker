<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Data Tempo Tracker & Accuracy Meter</title>
  <!-- Suppress 404 favicon requests in local server logs -->
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #000000;
    }

    .pd-patch {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Toggle Switch / Checkbox */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .pd-checkbox {
      width: 45px;
      height: 45px;
      border: 2px solid #000000;
      background-color: #fcfcfc;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .pd-checkbox.active::after {
      content: "✕";
      font-size: 32px;
      font-weight: bold;
      color: #000000;
    }
    .toggle-label {
      font-size: 28px;
      font-weight: bold;
    }

    /* Automatic Level Controls */
    .level-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .level-label {
      font-size: 26px;
      font-weight: bold;
    }
    .level-box {
      border: 2px solid #000000;
      width: 300px;
      height: 60px;
      display: grid;
      grid-template-columns: 206px 90px;
      background-color: #fcfcfc;
    }
    .vu-area {
      position: relative;
      border-right: 2px solid #000000;
      display: flex;
      align-items: center;
      padding: 0;
      overflow: hidden;
      background: #e0e0e0;
    }
    .vu-meter-fill {
      height: 100%;
      width: 0%;
      background-color: #4caf50;
      transition: width 0.03s linear;
    }
    /* Auto-threshold visual marker overlay */
    .threshold-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: #ff0000;
      left: 10%;
      transition: left 0.05s ease;
      z-index: 2;
    }
    
    /* Bang Circle Indicator */
    .bang-area {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fcfcfc;
    }
    .bang-circle {
      width: 52px;
      height: 52px;
      border: 2px solid #000000;
      border-radius: 50%;
      background-color: #fcfcfc;
      transition: background-color 0.05s ease-out;
    }
    .bang-circle.flash {
      background-color: #000000;
    }

    /* BPM Section */
    .bpm-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bpm-label {
      font-size: 26px;
      font-weight: bold;
    }
    .bpm-atom {
      width: 300px;
      height: 50px;
      font-size: 36px;
    }

    /* Variation Metrics Section */
    .variation-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .metrics-labels {
      display: flex;
      gap: 6px;
      width: 300px;
    }
    .metric-label {
      flex: 1;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
    }

    /* Full Rectangle Number Atom Displays */
    .atoms-row {
      display: flex;
      gap: 6px;
      width: 300px;
    }
    .pd-atom {
      flex: 1;
      height: 42px;
      border: 2px solid #000000;
      background-color: #fcfcfc;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 32px;
      font-weight: bold;
      position: relative;
    }

    /* Concentric Accuracy Color Squares */
    .squares-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin-top: 10px;
    }
    .square-big {
      position: absolute;
      top: 0;
      left: 0;
      width: 300px;
      height: 300px;
      background-color: #e1e1e1;
      border: 2px solid #000000;
      transition: background-color 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .square-med {
      width: 200px;
      height: 200px;
      background-color: #e1e1e1;
      border: 2px solid #000000;
      transition: background-color 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .square-sml {
      width: 100px;
      height: 100px;
      background-color: #e1e1e1;
      border: 2px solid #000000;
      transition: background-color 0.15s ease;
    }

    .instructions {
      margin-top: 15px;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      width: 300px;
    }
  </style>
</head>
<body>

  <div class="pd-patch">
    <!-- DSP Audio Toggle -->
    <div class="toggle-container" id="toggleDsp">
      <div class="pd-checkbox" id="dspCheckbox"></div>
      <div class="toggle-label">mic on/off</div>
    </div>

    <!-- Automatic Level Controls -->
    <div class="level-section">
      <div class="level-label">auto level</div>
      <div class="level-box">
        <div class="vu-area">
          <div class="vu-meter-fill" id="vuMeter"></div>
          <div class="threshold-marker" id="thresholdMarker" title="Auto-Calibrated Threshold"></div>
        </div>
        <div class="bang-area">
          <div class="bang-circle" id="bangIndicator"></div>
        </div>
      </div>
    </div>

    <!-- Beats Per Minute Display -->
    <div class="bpm-section">
      <div class="bpm-label">bpm</div>
      <div class="pd-atom bpm-atom" id="atomBpm">0</div>
    </div>

    <!-- Variation Metrics Section -->
    <div class="variation-section">
      <div class="metrics-labels">
        <div class="metric-label">% variation</div>
        <div class="metric-label">last 4</div>
        <div class="metric-label">last 16</div>
      </div>
      <div class="atoms-row">
        <div class="pd-atom" id="atomInstant">0</div>
        <div class="pd-atom" id="atom4ave">0</div>
        <div class="pd-atom" id="atom16ave">0</div>
      </div>
    </div>

    <!-- Concentric Accuracy Color Squares -->
    <div class="squares-container">
      <div class="square-big" id="sqBig">
        <div class="square-med" id="sqMed">
          <div class="square-sml" id="sqSml"></div>
        </div>
      </div>
    </div>

    <div class="instructions">
      • <strong>Auto-Threshold:</strong> Red line on meter adapts automatically to background noise.<br>
      • <strong>Microphone:</strong> Click <code>mic on/off</code> to toggle audio input.<br>
      • <strong>Keyboard:</strong> Tap any key (e.g. Spacebar) to test timing without audio.
    </div>
  </div>

  <script>
    let isAudioActive = false;
    let audioCtx = null;
    let micStream = null;
    let scriptNode = null;
    
    // Adaptive Noise Floor and Peak Envelope Tracking
    let noiseFloor = 0.01;
    let peakEnvelope = 0.08;
    let prevSample = 0;
    let lastPeakTimeSec = 0;

    let intervalHistory = [];
    let lastTapTimeMs = null;
    
    let instantErrors = [];
    let ave4Errors = [];

    const dspCheckbox = document.getElementById('dspCheckbox');
    const toggleDsp = document.getElementById('toggleDsp');
    const vuMeter = document.getElementById('vuMeter');
    const thresholdMarker = document.getElementById('thresholdMarker');
    const bangIndicator = document.getElementById('bangIndicator');
    
    const atomBpm = document.getElementById('atomBpm');
    const atomInstant = document.getElementById('atomInstant');
    const atom4ave = document.getElementById('atom4ave');
    const atom16ave = document.getElementById('atom16ave');
    
    const sqBig = document.getElementById('sqBig');
    const sqMed = document.getElementById('sqMed');
    const sqSml = document.getElementById('sqSml');

    function resetDSPState() {
      lastPeakTimeSec = 0;
      prevSample = 0;
      noiseFloor = 0.01;
      peakEnvelope = 0.08;
      lastTapTimeMs = null;
      intervalHistory = [];
      instantErrors = [];
      ave4Errors = [];
    }

    toggleDsp.addEventListener('click', () => {
      isAudioActive = !isAudioActive;
      if (isAudioActive) {
        dspCheckbox.classList.add('active');
        initAudio();
      } else {
        dspCheckbox.classList.remove('active');
        stopAudio();
      }
    });

    function triggerBang() {
      bangIndicator.classList.add('flash');
      setTimeout(() => {
        bangIndicator.classList.remove('flash');
      }, 80);
    }

    async function initAudio() {
      resetDSPState();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        isAudioActive = false;
        dspCheckbox.classList.remove('active');
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const source = audioCtx.createMediaStreamSource(micStream);
        scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
        
        source.connect(scriptNode);
        scriptNode.connect(audioCtx.destination);
        scriptNode.onaudioprocess = processAudioBuffer;
      } catch (err) {
        isAudioActive = false;
        dspCheckbox.classList.remove('active');
      }
    }

    function stopAudio() {
      resetDSPState();

      if (scriptNode) scriptNode.disconnect();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      vuMeter.style.width = '0%';
    }

    function processAudioBuffer(evt) {
      const input = evt.inputBuffer.getChannelData(0);
      const bufferLen = input.length;
      const sampleRate = evt.inputBuffer.sampleRate;
      const sampleDuration = 1.0 / sampleRate;
      const bufferStartTime = evt.playbackTime;

      let maxAmp = 0;
      let detectedSampleIdx = -1;
      const minInterBeatSec = 0.12; 

      for (let i = 0; i < bufferLen; i++) {
        const absVal = Math.abs(input[i]);
        if (absVal > maxAmp) maxAmp = absVal;

        // Continuous noise floor adaptation
        if (absVal < noiseFloor) {
          noiseFloor = noiseFloor * 0.95 + absVal * 0.05;
        } else {
          noiseFloor = noiseFloor * 0.9995 + absVal * 0.0005;
        }

        // Dynamic peak envelope tracking
        if (absVal > peakEnvelope) {
          peakEnvelope = absVal;
        } else {
          peakEnvelope = Math.max(0.04, peakEnvelope * 0.9992);
        }

        // Auto-calculated trigger threshold
        const dynamicThreshold = Math.max(0.035, noiseFloor + (peakEnvelope - noiseFloor) * 0.32);

        const derivative = Math.max(0, absVal - prevSample);
        prevSample = absVal;

        // Dynamic transient onset detection
        if (derivative > (dynamicThreshold * 0.35) && absVal > dynamicThreshold) {
          const currentSampleTimeSec = bufferStartTime + (i * sampleDuration);

          if (currentSampleTimeSec - lastPeakTimeSec > minInterBeatSec) {
            let localMaxIdx = i;
            let localMaxVal = absVal;
            for (let k = 1; k <= 3 && (i + k) < bufferLen; k++) {
              if (Math.abs(input[i + k]) > localMaxVal) {
                localMaxVal = Math.abs(input[i + k]);
                localMaxIdx = i + k;
              }
            }
            detectedSampleIdx = localMaxIdx;
            lastPeakTimeSec = bufferStartTime + (detectedSampleIdx * sampleDuration);
            break;
          }
        }
      }

      // Update green VU meter level
      const meterPercent = Math.min(100, Math.max(0, (maxAmp / 0.8) * 100));
      vuMeter.style.width = meterPercent + '%';

      // Update position of red dynamic threshold marker line
      const currentDynamicThresh = Math.max(0.035, noiseFloor + (peakEnvelope - noiseFloor) * 0.32);
      const threshPercent = Math.min(98, Math.max(2, (currentDynamicThresh / 0.8) * 100));
      thresholdMarker.style.left = threshPercent + '%';

      if (detectedSampleIdx >= 0) {
        const exactTimeMs = lastPeakTimeSec * 1000.0;
        registerTap(exactTimeMs);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
      }
      registerTap(performance.now());
    });

    function registerTap(nowMs) {
      triggerBang();

      if (lastTapTimeMs !== null) {
        const interval = nowMs - lastTapTimeMs;
        
        if (interval >= 120) {
          // Store interval history up to 16 samples
          intervalHistory.push(interval);
          if (intervalHistory.length > 16) {
            intervalHistory.shift();
          }

          // Calculate average BPM using up to the last 16 clicks
          const avgInterval = intervalHistory.reduce((a, b) => a + b, 0) / intervalHistory.length;
          const currentBpm = Math.round(60000 / avgInterval);
          atomBpm.textContent = currentBpm;

          if (intervalHistory.length >= 4) {
            calculateAccuracyMetrics();
          }
        }
      }
      lastTapTimeMs = nowMs;
    }

    function calculateAccuracyMetrics() {
      // Use latest 4 intervals for variation metrics calculation
      const last4 = intervalHistory.slice(-4);
      const [t3, t2, t1, t0] = last4;

      const tAvg4 = (t0 + t1 + t2 + t3) / 4.0;

      const diff1 = Math.abs(t0 - t1);
      const diff2 = Math.abs(t1 - t2);
      const diff3 = Math.abs(t2 - t3);

      const meanDiff = (diff1 + diff2 + diff3) / 3.0;

      const instantVal = Math.round((meanDiff / tAvg4) * 100);

      instantErrors.push(instantVal);
      if (instantErrors.length > 4) instantErrors.shift();

      const ave4Val = Math.round(
        instantErrors.reduce((a, b) => a + b, 0) / instantErrors.length
      );

      ave4Errors.push(ave4Val);
      if (ave4Errors.length > 4) ave4Errors.shift();

      const ave16Val = Math.round(
        ave4Errors.reduce((a, b) => a + b, 0) / ave4Errors.length
      );

      atomInstant.textContent = instantVal;
      atom4ave.textContent = ave4Val;
      atom16ave.textContent = ave16Val;

      sqSml.style.backgroundColor = getPDColor(instantVal);
      sqMed.style.backgroundColor = getPDColor(ave4Val);
      sqBig.style.backgroundColor = getPDColor(ave16Val);
    }

    function getPDColor(err) {
      if (err === null || err === undefined || isNaN(err)) return '#e1e1e1';
      const e = Math.max(0, err);
      let r = 0, g = 0, b = 0;

      if (e <= 0) {
        r = 0; g = 225; b = 0;
      } else if (e <= 5) {
        r = Math.min(255, Math.round(51 * e));
        g = 225;
        b = 0;
      } else if (e <= 10) {
        r = 255;
        g = Math.max(0, Math.round(225 - 51 * (e - 5)));
        b = 0;
      } else {
        r = 255; g = 0; b = 0;
      }

      const toHex = (n) => n.toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }
  </script>
</body>
</html>
